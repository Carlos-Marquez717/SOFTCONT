{% load static %}
<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <title>Informes del día {{ fecha }}</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      font-size: 11px;
      margin: 0;
      padding: 0;
    }

    .tabla-informe {
      border-collapse: collapse;
      width: 90%;
      margin: 0 auto 10px auto;
      page-break-inside: avoid;
      break-inside: avoid;
    }

    .tabla-informe th,
    .tabla-informe td {
      border: 1px solid #000;
      padding: 6px;
      text-align: center;
    }

    .tabla-informe th {
      background: #0d6efd;
      font-weight: bold;
    }

    .tabla-informe img {
      max-width: 120px;
      max-height: 120px;
      object-fit: cover;
    }

    .imagenes-contenedor {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 8px;
    }

    .imagenes-contenedor img {
      flex: 1 1 100px;
      max-width: 50px;
      max-height: 50px;
      object-fit: contain;
    }

    .pagina {
      page-break-after: always;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      min-height: 100vh;
    }

    .tabla-informe-wrapper {
      flex: 1;
      margin-bottom: 10px;
    }

    @page {
      margin: 10px 30px 10px 30px;
    }
  </style>
</head>
<body>

  {% for tabla in tablas_html %}
    {% if forloop.counter0|divisibleby:2 %}
      <div class="pagina">
    {% endif %}
    {{ tabla|safe }}
    {% if forloop.counter|divisibleby:2 or forloop.last %}
      </div>
    {% endif %}
  {% endfor %}
</body>
</html>
