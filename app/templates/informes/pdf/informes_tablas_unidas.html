{% load static %}

<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Informes del día {{ fecha }}</title>
    <style>
        body { font-family: Arial, sans-serif; font-size: 12px; margin: 0px 30px; }
        .tabla-informe { margin-bottom: 0; border-collapse: collapse; width: 100%; }
        .tabla-informe th, .tabla-informe td { border: 1px solid #000; padding: 6px; text-align: center; }
        .tabla-informe th { background: #FFC000; font-weight: bold; }
        .tabla-informe img { max-width: 120px; max-height: 120px; object-fit: cover; }
        .tabla-informe .no-img { height: 120px; border: 1px dashed #aaa; display: flex; align-items: center; justify-content: center; }
        .tabla-informe .imagenes-contenedor {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 8px;
        }
        .tabla-informe .imagenes-contenedor img {
            flex: 1 1 100px;
            max-width: 120px;
            max-height: 120px;
            min-width: 80px;
            min-height: 80px;
            object-fit: contain;
            margin: 2px;
        }
        /* Ajuste responsivo para muchas imágenes */
        @media (max-width: 600px) {
            .tabla-informe .imagenes-contenedor img {
                max-width: 80px;
                max-height: 80px;
            }
        }
    </style>
</head>
<body style="margin-top:0;">
    <div style="display: flex; align-items: flex-start; justify-content: space-between; margin-bottom: 10px; margin-top:0;">
        <img src="{{ logo_izq_b64 }}" style="height:60px;">
        <div style="flex: 1; text-align: center; margin-top:0;">
            <h1 style="margin: 0; font-size: 22px; letter-spacing: 1px;">INFORMES DEL DÍA</h1>
            <h2 style="margin: 0; font-size: 16px; font-weight: normal;">{{ fecha }}</h2>
        </div>
        <img src="{{ logo_der_b64 }}" style="height:60px;">
    </div>
    <hr style="margin-bottom: 10px; margin-top:0;">
    {% for tabla_html in tablas_html %}
        {{ tabla_html|safe }}
    {% endfor %}
</body>
</html>
