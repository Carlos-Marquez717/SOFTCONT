<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Informe - Orden y Limpieza</title>
    <style>
        body { font-family: Arial, sans-serif; font-size: 12px; margin: 30px; }
        h2 { text-align: center; }
        table { width: 100%; border-collapse: collapse; margin-top: 20px; }
        th, td { border: 1px solid #000; padding: 8px; text-align: left; }
        .anexo { margin-top: 40px; }
        .img-grid { display: flex; justify-content: space-between; margin-top: 10px; }
        .img-grid img { width: 48%; border: 1px solid #000; height: 200px; object-fit: cover; }
    </style>
</head>
<body>
    <h2>INFORME DE ORDEN Y LIMPIEZA</h2>

    <table>
        <tr>
            <th>ID</th>
            <td>{{ informe.id }}</td>
        </tr>
        <tr>
            <th>Hora</th>
            <td>{{ informe.hora }}</td>
        </tr>
        <tr>
            <th>Tarea</th>
            <td>{{ informe.tarea }}</td>
        </tr>
        <tr>
            <th>Descripción</th>
            <td>{{ informe.descripcion }}</td>
        </tr>
    </table>

    <div class="anexo">
        <h3>ANEXO - IMÁGENES</h3>
        <div class="img-grid">
            <div>
                <strong>ANTES</strong><br>
                {% if informe.imagen_antes %}
                    <img src="{{ informe.imagen_antes.url }}">
                {% else %}
                    <div style="height: 200px; border: 1px dashed #aaa;">Sin imagen</div>
                {% endif %}
            </div>
            <div>
                <strong>DESPUÉS</strong><br>
                {% if informe.imagen_despues %}
                    <img src="{{ informe.imagen_despues.url }}">
                {% else %}
                    <div style="height: 200px; border: 1px dashed #aaa;">Sin imagen</div>
                {% endif %}
            </div>
        </div>
    </div>
</body>
</html>
