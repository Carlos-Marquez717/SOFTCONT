[phases.setup]
nixPkgs = [
  "python311",
  "python311Packages.pip",
  "cairo",
  "pango",
  "gdk-pixbuf",
  "glib",
  "gobject-introspection",
  "libffi",
  "pkg-config"
]

[phases.build]
cmds = [
  "pip install --upgrade pip",
  "pip install -r requirements.txt"
]

[start]
cmd = "python manage.py migrate && python manage.py collectstatic --noinput && gunicorn bodega.wsgi"

cmd = "python manage.py migrate && python manage.py collectstatic --noinput && gunicorn bodega.wsgi"
